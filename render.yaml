services:
  - type: web
    name: greater-dhaka-association-gda
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gda-denmark-database
          property: connectionString

databases:
  - name: gda-denmark-database
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
